<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1A33"/>
      <stop offset="0.55" stop-color="#3B2340"/>
      <stop offset="1" stop-color="#5A3456"/>
    </linearGradient>
    <linearGradient id="plum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#875380"/>
      <stop offset="1" stop-color="#6B3F66"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7893F"/>
      <stop offset="1" stop-color="#F26B1D"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#FFFFFF" opacity="0.07"/>
    </pattern>
    <marker id="headR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#F7893F"/>
    </marker>
    <marker id="headL" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C9A6C4"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1120" height="560" fill="url(#bg)"/>
  <rect width="1120" height="560" fill="url(#dots)"/>
  <circle cx="1040" cy="40" r="210" fill="#F26B1D" opacity="0.10"/>
  <circle cx="620" cy="560" r="180" fill="#875380" opacity="0.25"/>

  <!-- Left: text -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <rect x="64" y="92" width="236" height="34" rx="17" fill="#FFFFFF" opacity="0.12"/>
    <text x="182" y="115" text-anchor="middle" font-size="15" font-weight="600" fill="#F7C9A8" letter-spacing="2">ODOO 19 CONNECTOR</text>

    <text x="62" y="208" font-size="70" font-weight="800" fill="#FFFFFF">Magento</text>
    <text x="62" y="284" font-size="70" font-weight="800" fill="#F7893F">Connector</text>

    <text x="64" y="336" font-size="22" fill="#E6D8E4">Publish catalog, prices and stock from Odoo.</text>
    <text x="64" y="366" font-size="22" fill="#E6D8E4">Import Magento orders through background jobs.</text>

    <!-- chips -->
    <g font-size="15" font-weight="600" fill="#FFFFFF">
      <rect x="64"  y="404" width="98"  height="34" rx="17" fill="#FFFFFF" opacity="0.10"/>
      <text x="113" y="426" text-anchor="middle">Products</text>
      <rect x="172" y="404" width="78"  height="34" rx="17" fill="#FFFFFF" opacity="0.10"/>
      <text x="211" y="426" text-anchor="middle">Prices</text>
      <rect x="260" y="404" width="76"  height="34" rx="17" fill="#FFFFFF" opacity="0.10"/>
      <text x="298" y="426" text-anchor="middle">Stock</text>
      <rect x="346" y="404" width="82"  height="34" rx="17" fill="#FFFFFF" opacity="0.10"/>
      <text x="387" y="426" text-anchor="middle">Orders</text>

      <rect x="64"  y="448" width="114" height="34" rx="17" fill="#FFFFFF" opacity="0.10"/>
      <text x="121" y="470" text-anchor="middle">Customers</text>
      <rect x="188" y="448" width="114" height="34" rx="17" fill="#FFFFFF" opacity="0.10"/>
      <text x="245" y="470" text-anchor="middle">Shipments</text>
      <rect x="312" y="448" width="98"  height="34" rx="17" fill="#FFFFFF" opacity="0.10"/>
      <text x="361" y="470" text-anchor="middle">Invoices</text>
    </g>
  </g>

  <!-- Right: two connected systems -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <!-- Panel -->
    <rect x="560" y="70" width="500" height="420" rx="28" fill="#FFFFFF" opacity="0.06"/>

    <!-- Odoo-side node: generic rounded square with grid glyph -->
    <g filter="url(#shadow)">
      <rect x="600" y="190" width="140" height="140" rx="30" fill="url(#plum)"/>
    </g>
    <g fill="#FFFFFF">
      <rect x="636" y="222" width="30" height="30" rx="8"/>
      <rect x="674" y="222" width="30" height="30" rx="8" opacity="0.7"/>
      <rect x="636" y="260" width="30" height="30" rx="8" opacity="0.7"/>
      <rect x="674" y="260" width="30" height="30" rx="8"/>
    </g>
    <text x="670" y="362" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">Odoo</text>
    <text x="670" y="384" text-anchor="middle" font-size="14" fill="#C9A6C4">ERP</text>

    <!-- Magento-side node: generic hexagon with storefront bag glyph -->
    <g filter="url(#shadow)">
      <path d="M950 186 L1012 222 L1012 298 L950 334 L888 298 L888 222 Z" fill="url(#orange)" stroke="url(#orange)" stroke-width="10" stroke-linejoin="round"/>
    </g>
    <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M926 240 L974 240 L970 290 L930 290 Z" fill="#FFFFFF" fill-opacity="0.18"/>
      <path d="M938 240 C938 222, 962 222, 962 240"/>
    </g>
    <text x="950" y="362" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">Magento</text>
    <text x="950" y="384" text-anchor="middle" font-size="14" fill="#F7C9A8">Online store</text>

    <!-- Sync arrows -->
    <path d="M756 236 C800 206, 836 206, 872 232" fill="none" stroke="#F7893F" stroke-width="5" stroke-linecap="round" marker-end="url(#headR)"/>
    <path d="M872 288 C836 314, 800 314, 756 290" fill="none" stroke="#C9A6C4" stroke-width="5" stroke-linecap="round" marker-end="url(#headL)"/>
    <!-- sync badge -->
    <circle cx="814" cy="260" r="22" fill="#2A1A33" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
      <path d="M804 256 A11 11 0 0 1 824 254"/>
      <path d="M824 264 A11 11 0 0 1 804 266"/>
    </g>
    <path d="M820 248 L826 255 L818 257 Z" fill="#FFFFFF"/>
    <path d="M808 272 L802 265 L810 263 Z" fill="#FFFFFF"/>

    <text x="814" y="182" text-anchor="middle" font-size="12" font-weight="600" fill="#F7C9A8">catalog · prices · stock</text>
    <text x="806" y="350" text-anchor="middle" font-size="12" font-weight="600" fill="#E6D8E4">orders · customers · invoices</text>

    <!-- Bottom icon row: product / order / inventory -->
    <g>
      <!-- Product (cube) -->
      <rect x="616" y="414" width="124" height="52" rx="16" fill="#FFFFFF" opacity="0.10"/>
      <g fill="none" stroke="#F7893F" stroke-width="2.5" stroke-linejoin="round">
        <path d="M640 430 L652 424 L664 430 L664 446 L652 452 L640 446 Z"/>
        <path d="M640 430 L652 436 L664 430 M652 436 L652 452"/>
      </g>
      <text x="674" y="446" font-size="15" font-weight="600" fill="#FFFFFF">Product</text>

      <!-- Order (receipt) -->
      <rect x="750" y="414" width="124" height="52" rx="16" fill="#FFFFFF" opacity="0.10"/>
      <g fill="none" stroke="#F7893F" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
        <path d="M776 424 L796 424 L796 452 L792 449 L788 452 L784 449 L780 452 L776 449 Z"/>
        <path d="M780 432 L792 432 M780 438 L792 438 M780 444 L788 444"/>
      </g>
      <text x="808" y="446" font-size="15" font-weight="600" fill="#FFFFFF">Order</text>

      <!-- Inventory (stacked boxes) -->
      <rect x="884" y="414" width="136" height="52" rx="16" fill="#FFFFFF" opacity="0.10"/>
      <g fill="none" stroke="#F7893F" stroke-width="2.5" stroke-linejoin="round">
        <rect x="902" y="438" width="14" height="14" rx="2"/>
        <rect x="918" y="438" width="14" height="14" rx="2"/>
        <rect x="910" y="423" width="14" height="14" rx="2"/>
      </g>
      <text x="940" y="446" font-size="15" font-weight="600" fill="#FFFFFF">Inventory</text>
    </g>
  </g>
</svg>
